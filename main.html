<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>
	<style>
		body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #f5f5f7;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            max-width: 700px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            color: #61afef;
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid rgba(97, 175, 239, 0.3);
            padding-bottom: 15px;
        }

        p {
            line-height: 1.8;
            font-size: 1.1rem;
            color: #abb2bf;
            margin-bottom: 20px;
        }

        .highlight {
            color: #98c379;
            font-weight: 600;
        }
	</style>

<body>
	<div class="container">
	<h1>Why I want to become a developer?</h1>
	<p>I want to become a software developer because I am passionate about technology and love solving complex problems. Building applications that can improve people's daily lives motivates me to learn new coding skills every day.</p>
	</div>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>
</body>

</html>
